plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
    id "me.modmuss50.mod-publish-plugin" version "0.8.4"
}

var mod_version = project.mod_version
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven { url "https://jitpack.io/" }
    maven {
        name = "Ladysnake Mods"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/" }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "thermoo-patches" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        mappings file("mappings/yarn-custom.tiny")
    }
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "com.github.thedeathlycow:thermoo:v${project.thermoo_version}"
    modImplementation "com.terraformersmc:modmenu:${project.mod_menu_version}"
    modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }


    // integrations
    modCompileOnly "maven.modrinth:libhud:${project.libhud_version}"
    modCompileOnly "maven.modrinth:armorpoints:${project.armorpointspp_version}"
    modCompileOnly "maven.modrinth:colorful-hearts:${project.colorfulhearts_version}"
    modCompileOnly "maven.modrinth:overflowing-bars:${project.overflowingbars_version}"
    modCompileOnly "maven.modrinth:immersive-weathering:${project.immersive_weathering_version}"
    modCompileOnly "maven.modrinth:fabric-seasons:${project.fabric_seasons_version}"
    modCompileOnly "maven.modrinth:serene-seasons:${project.serene_seasons_version}"
    modCompileOnly "maven.modrinth:simple-seasons:${project.simple_seasons_version}"
    modCompileOnly "maven.modrinth:friends-and-foes:${project.friends_and_foes_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishMods {
    changelog = file("changelogs/${mod_version}.md").text
    type = STABLE

    file = remapJar.archiveFile
    modLoaders.add("fabric")
    modLoaders.add("quilt")

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_API_KEY")
        projectId = "1012677"
        minecraftVersions.add("1.21.1")

        javaVersions.add(JavaVersion.VERSION_21)

        clientRequired = true
        serverRequired = true

        requires("fabric-api", "thermoo", "cloth-config")
        optional(
                "simple-seasons",
                "serene-seasons",
                "fabric-seasons",
                "friends-and-foes",
                "overflowing-bars",
                "colorful-hearts",
                "origins"
        )
        incompatible("immersive-weathering-fabric", "armorpoints")
    }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "TYRF9nUy"
        minecraftVersions.add("1.21.1")

        requires("fabric-api", "thermoo", "cloth-config")

        optional(
                "simple-seasons",
                "serene-seasons",
                "fabric-seasons",
                "friends-and-foes",
                "overflowing-bars",
                "colorful-hearts"
        )

        // when origins is out of alpha, version-specific dependency will be removed
        optional {
            slug = "origins"
            version = "RzhrT8Th"
        }

        incompatible("immersive-weathering", "armorpoints")
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}