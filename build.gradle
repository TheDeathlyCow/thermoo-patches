plugins {
    id 'net.neoforged.moddev' version '2.0.134'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = mod_id
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    mavenCentral()
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
    maven {
        url = "https://jitpack.io/"
    }
    maven {
        url "https://maven.su5ed.dev/releases"
    }
    maven {
        name 'Xander Maven'
        url 'https://maven.isxander.dev/releases'
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

sourceSets {
    sereneSeasons {
        java {
            srcDir 'src/sereneSeasons/java'
        }
        resources {
            srcDir 'src/sereneSeasons/resources'
        }

        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }

    overflowingBars {
        java {
            srcDir 'src/overflowingBars/java'
        }
        resources {
            srcDir 'src/overflowingBars/resources'
        }

        compileClasspath += main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

neoForge {
    version = project.loader_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }

        data {
            data()

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/main/generated/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }

        "${mod_id}_serene_seasons_patch" {
            sourceSet(sourceSets.sereneSeasons)
        }

        "${mod_id}_overflowing_bars_patch" {
            sourceSet(sourceSets.sereneSeasons)
        }
    }
}

sourceSets.main.resources { srcDir 'src/main/generated' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}


dependencies {
    // To change the versions see the gradle.properties file
    jarJar(api("dev.yumi.mc.core:yumi-mc-foundation:${project.yumi_mc_version}") {
        attributes {
            attribute(Attribute.of("net.minecraft.mappings", String), "mojmap")
        }
    })

    api "com.github.thedeathlycow:thermoo:v${project.thermoo_version}"
    api "dev.isxander:yet-another-config-lib:${project.yacl_version}"

    sereneSeasonsCompileOnly("maven.modrinth:serene-seasons:${project.serene_seasons_version}")

    overflowingBarsCompileOnly("maven.modrinth:overflowing-bars:${project.overflowingbars_version}")
}

def createModMetadataTask(String sourceSetName) {
    var taskName = "generate${sourceSetName.capitalize()}Metadata"
    var generateMetadata = tasks.register(taskName, ProcessResources) {
        var replaceProperties = [
                "mod_id"         : project.mod_id,
                "version"        : project.mod_version,
                "loader_version" : project.loader_version,
                "thermoo_version": project.thermoo_version,
                "yacl_version"   : project.yacl_version,
        ]
        inputs.properties replaceProperties
        expand replaceProperties
        from "src/${sourceSetName}/templates"
        into "build/generated/sources/${sourceSetName}"
    }
    sourceSets.named(sourceSetName).get().resources.srcDir generateMetadata
    neoForge.ideSyncTask generateMetadata
}

sourceSets.configureEach { sourceSet ->
    if (!(sourceSet.name in ['test', 'gametest', 'datagen'])) {
        createModMetadataTask(sourceSet.name)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
